name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ci:
    uses: saas-auto-catalogo/.github/.github/workflows/reusable-vite-ci.yml@main

  deploy:
    name: deploy-vps
    needs: ci
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy SPA over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:Y2xt7oRzNaWivQcaxk3a9G4YuUWE0aEsuGhjcYeqR8k
          timeout: 2m
          command_timeout: 20m
          script: |
            set -euo pipefail
            /opt/autocatalogo/scripts/publish-spas.sh frontend-app

      - name: HTTPS check
        run: |
          set -euo pipefail
          code=$(curl -fsSI -o /dev/null -w '%{http_code}' https://app.drivesync.me/)
          echo "http_code=$code"
          test "$code" = "200"

